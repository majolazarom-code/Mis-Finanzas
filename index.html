<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf0"><title>Mi Finanzas 💛</title><link rel="manifest" href="manifest.json"><style>
:root{--yellow:#ffcf26;--ink:#25212b;--muted:#77717d;--line:#eee9e2;--bg:#fffaf1;--purple:#7953a6}*{box-sizing:border-box}body{margin:0;background:#f0ece7;color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8b6ad0}#app{max-width:510px;min-height:100dvh;margin:auto;background:linear-gradient(#fffefb,#fffaf3);padding:22px 18px 100px;box-shadow:0 4px 35px #0001}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{font:italic 30px Georgia,serif;letter-spacing:-1px}.brand b{font-weight:400;color:#e8b300}.round{width:48px;height:48px;border:0;border-radius:50%;background:var(--yellow);font-size:28px;box-shadow:0 4px 12px #e9bc3344}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.muted{color:var(--muted)}h1{font-size:25px;margin:8px 0}h2{font-size:19px;margin:23px 0 12px}h3{margin:0 0 9px;font-size:16px}.hero{background:linear-gradient(110deg,#fff5bb,#ffe16b);border-radius:24px;padding:23px 20px;box-shadow:0 8px 18px #d6a92b22;margin:18px 0}.hero .amount{font-size:36px;font-weight:800;margin-top:7px}.icon{display:inline-grid;place-items:center;min-width:42px;width:42px;height:42px;border-radius:15px;background:#fff1c8;font-size:23px}.tile{border-radius:22px;padding:18px 15px;box-shadow:0 5px 13px #00000009;flex:1}.mint{background:#e3f8eb}.pink{background:#ffe8ed}.lilac{background:#f1e6ff}.cream{background:#fff4cb}.tiles{display:flex;gap:12px}.tile strong{font-size:22px;display:block;margin-top:9px}.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0}.shortcut{background:white;border:1px solid var(--line);border-radius:20px;padding:13px 4px;font-size:11px;text-align:center;box-shadow:0 4px 9px #00000008}.shortcut .icon{margin:auto auto 7px}.card{background:white;border:1px solid #f2eee7;border-radius:20px;padding:15px;margin:10px 0;box-shadow:0 5px 15px #00000008}.listrow{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #f1efeb}.listrow:last-child{border:0}.grow{flex:1;min-width:0}.small{font-size:12px}.money{font-weight:700;white-space:nowrap}.red{color:#d52e51}.green{color:#0b8749}.pill{border-radius:100px;background:#fff0b7;padding:6px 10px;font-size:12px;font-weight:700}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:510px;width:100%;background:#fffefcf5;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 3px max(12px,env(safe-area-inset-bottom));z-index:10}.nav button{border:0;background:transparent;color:#59535d;min-width:56px;padding:6px 2px;border-radius:14px;font-size:10px}.nav button.active{background:#fff0bd;color:#a46b00}.nav button span{display:block;font-size:24px;margin-bottom:3px}.primary{background:var(--yellow);border:0;border-radius:18px;padding:15px 20px;font-weight:750;color:#211900;width:100%;margin:9px 0}.secondary{background:#f1e4ff;border:0;border-radius:15px;padding:10px 15px;color:#59327c;font-weight:650}.outline{background:white;border:1px solid #ddd5c9;border-radius:13px;padding:9px 12px}.field{display:block;margin:14px 0;font-weight:650;font-size:13px}.field input,.field select,.field textarea{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid #e5dfe3;background:#fff;border-radius:15px;color:#27232c}.field textarea{min-height:80px}.tabs{display:flex;gap:8px;margin:12px 0}.tabs button{flex:1;border:1px solid #eee5dc;background:white;padding:12px;border-radius:30px}.tabs button.on{background:var(--yellow);border-color:var(--yellow);font-weight:750}.check{width:23px;height:23px;accent-color:#20b65e;cursor:pointer}.bar{height:10px;border-radius:20px;background:#eeeef2;overflow:hidden}.bar>div{height:100%;background:#ffc400;border-radius:20px}.overlay{position:fixed;inset:0;background:#28202b66;z-index:30;display:flex;align-items:end;justify-content:center}.sheet{width:min(510px,100%);max-height:90dvh;overflow:auto;background:#fffcf7;border-radius:26px 26px 0 0;padding:22px 20px max(25px,env(safe-area-inset-bottom))}.sheethead{display:flex;align-items:center;justify-content:space-between}.sheethead button{border:0;background:#f1e9e0;border-radius:50%;width:35px;height:35px}.donut{width:210px;height:210px;border-radius:50%;margin:22px auto;display:grid;place-items:center;position:relative}.donut:before{content:'';position:absolute;inset:39px;background:white;border-radius:50%}.donut span{position:relative;text-align:center;font-weight:750}.menuitem{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:white;border:1px solid #f0eae3;border-radius:17px;padding:13px;margin:9px 0}.empty{padding:24px;text-align:center;color:var(--muted)}@media(min-width:850px){#app{margin:25px auto;border-radius:32px;min-height:900px}.nav{bottom:0}}

/* Comparación simultánea de ingresos y gastos */
.compare-card{background:#fff;border:1px solid #f1ebdf;border-radius:24px;padding:19px 16px;margin:16px 0;box-shadow:0 6px 16px #00000009}.compare-card h2{margin:0 0 8px}.compare-legend{display:flex;flex-wrap:wrap;gap:13px;font-size:12px;margin:12px 0 20px;color:#625c66}.compare-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.compare-row{margin:15px 0}.compare-label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;margin-bottom:7px}.compare-label strong{font-size:15px}.compare-track{height:20px;background:#f5f2ef;border-radius:12px;overflow:hidden}.compare-fill{height:100%;border-radius:12px;min-width:0;transition:width .25s ease}.compare-fill.income{background:linear-gradient(90deg,#91e2ad,#39b87c)}.compare-fill.expense{background:linear-gradient(90deg,#ffc0ce,#f16b91)}.compare-result{background:#fff8d6;border-radius:16px;padding:13px 14px;margin-top:19px;display:flex;align-items:center;justify-content:space-between;gap:8px}.compare-result strong{font-size:18px}.compare-result.negative{background:#ffebef}.compare-caption{font-size:12px;color:#77717d;margin:11px 0 0;line-height:1.5}

.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;background:white;border-radius:22px;padding:10px;border:1px solid #f0e8d7}.weekday{text-align:center;font-size:11px;color:#777;padding:8px 0}.day{border:1px solid #f4eddf;background:#fffdf6;border-radius:12px;min-height:55px;padding:7px 2px;color:#39313a}.day:hover{background:#fff1b8}.dots{display:flex;justify-content:center;gap:2px;margin-top:7px;flex-wrap:wrap}.dot{width:6px;height:6px;border-radius:50%;background:#ccc}.dot.orange{background:#ffae52}.dot.green{background:#35b67b}.dot.purple{background:#9b77d7}.dot.pinkdot{background:#ed7b9e}
</style></head><body><main id="app"></main><div id="modal"></div><script>
const $=s=>document.querySelector(s),money=n=>'$ '+Math.round(Number(n)||0).toLocaleString('es-CO'),today=()=>new Date().toLocaleDateString('en-CA'),month=()=>today().slice(0,7),id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random()),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaultCats=[['Supermercado','🛒','expense'],['Transporte','🚙','expense'],['Comida','🍴','expense'],['Hogar','🏠','expense'],['Servicios','⚡','expense'],['Salud','💗','expense'],['Entretenimiento','🎬','expense'],['Compras','🛍️','expense'],['Educación','🎓','expense'],['Belleza','🌸','expense'],['Mascotas','🐾','expense'],['Otros','✨','expense'],['Sueldo','💼','income'],['Bono','🎁','income'],['Ventas','💰','income'],['Otros ingresos','🌱','income']].map(([name,icon,type])=>({id:id(),name,icon,type}));
const fresh=()=>({accounts:['Efectivo','Bancolombia','Nequi','Davivienda','Daviplata','Banco de Bogotá'].map(name=>({id:id(),name})),categories:defaultCats,transactions:[],plans:[],goals:[],budgets:[],reminders:[],transfers:[],debts:[]});let data;try{data=JSON.parse(localStorage.getItem('mf-v5'))||fresh()}catch{data=fresh()}for(const k of Object.keys(fresh()))if(!Array.isArray(data[k]))data[k]=[];let page='inicio',selectedMonth=month(),catType='expense',chartType='expense';const save=()=>{localStorage.setItem('mf-v5',JSON.stringify(data));render()};const find=(arr,key)=>arr.find(x=>x.id===key);const accountName=k=>find(data.accounts,k)?.name||'Sin cuenta';const cat=k=>find(data.categories,k)||{name:'Sin categoría',icon:'✨'};const total=(arr)=>arr.reduce((s,x)=>s+Number(x.amount||0),0);const txMonth=()=>data.transactions.filter(t=>t.date?.startsWith(selectedMonth));const income=()=>total(txMonth().filter(t=>t.type==='income'));const expenses=()=>total(txMonth().filter(t=>t.type==='expense'));const balance=()=>total(data.transactions.filter(t=>t.type==='income'))-total(data.transactions.filter(t=>t.type==='expense'));const plans=()=>{ensureRecurring(selectedMonth);return data.plans.filter(p=>p.month===selectedMonth)};const pending=()=>total(plans().filter(p=>!p.paid));const icon=(s)=>`<span class="icon">${s}</span>`;const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'short'}):'';
function header(){return `<header class="top"><div class="brand">Mi Finanzas <b>✿</b></div><button class="round" onclick="movement()" aria-label="Registrar movimiento">+</button></header>`}function nav(){return `<nav class="nav">${[['inicio','⌂','Inicio'],['plan','▣','Plan'],['movimientos','⇄','Movimientos'],['graficos','▥','Gráficos'],['mas','☷','Más']].map(([p,i,n])=>`<button class="${p===page?'active':''}" onclick="go('${p}')"><span>${i}</span>${n}</button>`).join('')}</nav>`}function go(p){page=p;render();window.scrollTo(0,0)}function selectMonth(){return `<label class="field">Mes <input type="month" value="${selectedMonth}" onchange="selectedMonth=this.value;render()"></label>`}
function txrow(t){return `<div class="listrow">${icon(cat(t.category).icon)}<div class="grow"><b>${esc(t.description||cat(t.category).name)}</b><div class="muted small">${esc(accountName(t.account))} · ${fmtDate(t.date)}</div></div><div class="money ${t.type==='expense'?'red':'green'}">${t.type==='expense'?'-':'+'} ${money(t.amount)}</div><button class="outline" onclick="deleteTx('${t.id}')" aria-label="Eliminar">×</button></div>`}
function home(){let ps=plans();let done=ps.filter(p=>p.paid).length;return `${header()}<h1>Hola ♡</h1><div class="muted">Tu dinero, a tu manera ✨</div>${selectMonth()}<section class="hero"><div class="row between"><span>👛 Balance disponible</span><span>☀️</span></div><div class="amount">${money(balance())}</div><div class="small">Ingresos reales menos gastos reales</div></section><div class="tiles"><div class="tile mint">↗ Ingresos<strong>${money(income())}</strong></div><div class="tile pink">↘ Gastos<strong>${money(expenses())}</strong></div></div><div class="shortcuts">${[['calendario','📅','Calendario'],['graficos','📊','Gráficos'],['categorias','🏷️','Categorías'],['ahorros','🐷','Ahorros']].map(([p,i,n])=>`<button class="shortcut" onclick="go('${p}')">${icon(i)}<br>${n}</button>`).join('')}</div><div class="card"><div class="row between"><h3>Plan de gastos del mes</h3><button class="outline" onclick="go('plan')">Ver todos ›</button></div><div class="bar"><div style="width:${ps.length?done/ps.length*100:0}%"></div></div><p class="small muted">${done} de ${ps.length} pagados · Pendiente: ${money(pending())}</p><b>Saldo proyectado: ${money(balance()-pending())}</b><p class="muted small">Saldo real menos pagos pendientes (sin ingresos futuros).</p></div><h2>Últimos movimientos</h2><p class="muted small">Ingresos y gastos recientes de todos los meses</p><div class="card">${data.transactions.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,5).map(txrow).join('')||'<div class="empty">Aún no hay movimientos. Pulsa + para comenzar.</div>'}</div>`}
function plan(){let ps=plans(),paid=ps.filter(p=>p.paid);return `${header()}<h1>🗓️ Plan de gastos</h1>${selectMonth()}<div class="tiles"><div class="tile cream">Planificado<strong>${money(total(ps))}</strong></div><div class="tile mint">Pagado<strong>${money(total(paid))}</strong></div></div><div class="tile pink" style="margin-top:12px">Pendiente<strong>${money(pending())}</strong></div><button class="primary" onclick="editPlan()">+ Planificar gasto</button><div class="row between"><h2>Gastos planificados (${ps.length})</h2><span class="pill">${paid.length} pagados</span></div><div class="card">${ps.map(p=>`<div class="listrow"><input class="check" type="checkbox" ${p.paid?'checked':''} onchange="togglePlan('${p.id}',this.checked)" aria-label="Marcar pago de ${esc(p.name)}"><div class="grow" onclick="editPlan('${p.id}')" style="cursor:pointer"><b>${esc(p.name)}</b><div class="muted small">${esc(cat(p.category).icon)} ${esc(cat(p.category).name)} ${p.paid?'· Pagado':'· Pendiente'} · vence ${p.dueDay||1}/${p.month?.slice(5)}</div></div><b>${money(p.amount)}</b><button class="outline" onclick="editPlan('${p.id}')">✎</button></div>`).join('')||'<div class="empty">Agrega tus gastos del mes y márcalos cuando los pagues.</div>'}</div>`}
function movements(){return `${header()}<h1>⇄ Movimientos</h1>${selectMonth()}<button class="primary" onclick="movement()">+ Nuevo movimiento</button><div class="card">${txMonth().slice().sort((a,b)=>b.date.localeCompare(a.date)).map(txrow).join('')||'<div class="empty">No hay movimientos registrados.</div>'}</div>`}
function comparisonChart(){const inc=income(),exp=expenses(),max=Math.max(inc,exp,1),net=inc-exp;return `<section class="compare-card"><h2>Ingresos vs. gastos</h2><p class="muted small">Comparación del mes seleccionado</p><div class="compare-legend"><span><i style="background:#39b87c"></i>Ingresos</span><span><i style="background:#f16b91"></i>Gastos</span></div><div class="compare-row"><div class="compare-label"><span>↗ Ingresos</span><strong>${money(inc)}</strong></div><div class="compare-track" role="img" aria-label="Ingresos: ${money(inc)}"><div class="compare-fill income" style="width:${inc/max*100}%"></div></div></div><div class="compare-row"><div class="compare-label"><span>↘ Gastos</span><strong>${money(exp)}</strong></div><div class="compare-track" role="img" aria-label="Gastos: ${money(exp)}"><div class="compare-fill expense" style="width:${exp/max*100}%"></div></div></div><div class="compare-result ${net<0?'negative':''}"><span>${net>=0?'Saldo del mes':'Déficit del mes'}</span><strong>${money(net)}</strong></div><p class="compare-caption">Solo incluye movimientos registrados. Los pagos planificados pendientes no se descuentan aquí.</p></section>`}function charts(){let rows=data.categories.filter(c=>c.type===chartType).map(c=>({...c,amount:total(txMonth().filter(t=>t.type===chartType&&t.category===c.id))})).filter(c=>c.amount>0).sort((a,b)=>b.amount-a.amount);let sum=total(rows),colors=['#ffd33d','#ffa1ba','#b9a1f5','#8ee2c0','#a4c7ff','#ffae77'];let at=0;let stops=rows.map((r,i)=>{let start=at;at+=r.amount/sum*100;return `${colors[i%colors.length]} ${start}% ${at}%`});return `${header()}<h1>📊 Gráficos</h1>${selectMonth()}${comparisonChart()}<h2>Distribución por categoría</h2><div class="tabs"><button class="${chartType==='expense'?'on':''}" onclick="chartType='expense';render()">Gastos</button><button class="${chartType==='income'?'on':''}" onclick="chartType='income';render()">Ingresos</button></div><div class="donut" style="background:conic-gradient(${stops.join(',')||'#eee 0% 100%'})"><span>Total<br>${money(sum)}</span></div><div class="card">${rows.map((r,i)=>`<div class="listrow">${icon(r.icon)}<div class="grow"><b>${esc(r.name)}</b></div><span>${Math.round(r.amount/sum*100)}%</span><b>${money(r.amount)}</b></div>`).join('')||'<div class="empty">Registra movimientos para ver el gráfico.</div>'}</div>`}
function more(){return `${header()}<h1>Más opciones ✨</h1>${[['calendario','🗓️','Calendario financiero','Ingresos, gastos y vencimientos'],['transferencias','🔁','Transferencias','Mover dinero entre cuentas'],['deudas','🧾','Compras a cuotas','Controla cuotas y saldos'],['cuentas','💳','Mis cuentas','Bancos, billeteras y efectivo'],['categorias','🏷️','Categorías','Crea y edita categorías'],['presupuestos','🎯','Presupuestos','Límites mensuales'],['ahorros','🐷','Ahorros','Metas de ahorro'],['recordatorios','📅','Recordatorios','Pagos y fechas'],['respaldo','☁️','Respaldo','Exportar e importar datos']].map(([p,i,n,d])=>`<button class="menuitem" onclick="go('${p}')">${icon(i)}<span class="grow"><b>${n}</b><div class="muted small">${d}</div></span>›</button>`).join('')}`}
function categories(){let rows=data.categories.filter(c=>c.type===catType);return `${header()}<h1>🏷️ Mis categorías</h1><div class="tabs"><button class="${catType==='expense'?'on':''}" onclick="catType='expense';render()">Gastos</button><button class="${catType==='income'?'on':''}" onclick="catType='income';render()">Ingresos</button></div><button class="primary" onclick="editCategory()">+ Agregar categoría</button><div class="card">${rows.map(c=>`<div class="listrow">${icon(c.icon)}<div class="grow"><b>${esc(c.name)}</b></div><button class="outline" onclick="editCategory('${c.id}')">✎</button><button class="outline" onclick="deleteCategory('${c.id}')">🗑</button></div>`).join('')}</div>`}
function accounts(){return `${header()}<h1>💳 Mis cuentas</h1><button class="primary" onclick="editAccount()">+ Agregar banco o cuenta</button><div class="card">${data.accounts.map(a=>`<div class="listrow">${icon(a.name==='Efectivo'?'💵':'💳')}<div class="grow"><b>${esc(a.name)}</b><div class="muted small">Saldo registrado: ${money(total(data.transactions.filter(t=>t.account===a.id&&t.type==='income'))-total(data.transactions.filter(t=>t.account===a.id&&t.type==='expense'))+total(data.transfers.filter(t=>t.to===a.id))-total(data.transfers.filter(t=>t.from===a.id)))}</div></div><button class="outline" onclick="editAccount('${a.id}')" aria-label="Editar cuenta">✎</button><button class="outline" onclick="deleteAccount('${a.id}')" aria-label="Eliminar cuenta">🗑</button></div>`).join('')}</div><p class="muted small">Los saldos se calculan con movimientos registrados, no se conectan a los bancos.</p>`}
function generic(key,title,desc){let rows=data[key].filter(x=>!x.month||x.month===selectedMonth);return `${header()}<h1>${title}</h1>${selectMonth()}<p class="muted">${desc}</p><button class="primary" onclick="editGeneric('${key}')">+ Agregar</button><div class="card">${rows.map(x=>`<div class="listrow">${icon(key==='ahorros'?'🐷':key==='presupuestos'?'🎯':'📅')}<div class="grow"><b>${esc(x.name)}</b><div class="muted small">${key==='ahorros'?'Ahorrado: '+money(x.saved)+' / '+money(x.amount):key==='presupuestos'?'Límite: '+money(x.amount):'Fecha: '+esc(x.date||'')}</div></div><button class="outline" onclick="editGeneric('${key}','${x.id}')">✎</button></div>`).join('')||'<div class="empty">No hay elementos todavía.</div>'}</div>`}
function backup(){return `${header()}<h1>☁️ Respaldo</h1><p>Guarda una copia de tus datos en un archivo JSON. Los datos se almacenan solamente en este navegador.</p><button class="primary" onclick="exportData()">Descargar copia de seguridad</button><label class="field">Restaurar desde JSON<input type="file" accept="application/json,.json" onchange="importData(this.files[0])"></label><p class="muted small">Importar reemplaza los datos actuales. Guarda una copia antes de hacerlo.</p>`}
function render(){const map={inicio:home,plan,movimientos:movements,graficos:charts,mas:more,categorias:categories,cuentas:accounts,presupuestos:()=>generic('budgets','🎯 Presupuestos','Define tus límites mensuales.'),ahorros:()=>generic('goals','🐷 Ahorros','Registra el progreso de tus metas.'),recordatorios:()=>generic('reminders','📅 Recordatorios','Consulta tus próximas fechas de pago.'),respaldo:backup,calendario:calendarPage,transferencias:transfersPage,deudas:debtsPage};$('#app').innerHTML=(map[page]||home)()+nav()}function closeModal(){$('#modal').innerHTML=''}function sheet(title,body){$('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="sheet"><div class="sheethead"><h2>${title}</h2><button onclick="closeModal()">×</button></div>${body}</section></div>`}const opts=(arr,value,fn)=>arr.map(x=>`<option value="${esc(x.id)}" ${value===x.id?'selected':''}>${esc(fn(x))}</option>`).join('');const cats=(type,value)=>opts(data.categories.filter(c=>c.type===type),value,c=>c.icon+' '+c.name);const accts=(value)=>opts(data.accounts,value,a=>a.name);
function movement(type='expense',prefill=''){sheet('Nuevo movimiento',`<form id="movementForm" onsubmit="saveMovement(event)"><div class="tabs"><button type="button" class="${type==='expense'?'on':''}" onclick="movement('expense')">↓ Gasto</button><button type="button" class="${type==='income'?'on':''}" onclick="movement('income')">↑ Ingreso</button></div><input type="hidden" name="type" value="${type}"><label class="field">Monto (COP)<input name="amount" type="number" min="1" step="1" value="${esc(prefill)}" required autofocus></label><label class="field">Descripción<input name="description" placeholder="Ej. Supermercado" required></label><label class="field">Categoría<select name="category" required>${cats(type)}</select></label><label class="field">Cuenta / Medio de pago<select name="account" required>${accts()}</select></label><label class="field">Fecha<input type="date" name="date" value="${today()}" required></label><button class="primary">Guardar movimiento</button></form>`)}function saveMovement(e){e.preventDefault();let f=new FormData(e.target);data.transactions.push({id:id(),type:f.get('type'),amount:+f.get('amount'),description:f.get('description').trim(),category:f.get('category'),account:f.get('account'),date:f.get('date')});closeModal();save()}function deleteTx(k){if(confirm('¿Eliminar este movimiento?')){let t=find(data.transactions,k);if(t?.planId){let p=find(data.plans,t.planId);if(p){p.paid=false;p.transactionId=null}}data.transactions=data.transactions.filter(x=>x.id!==k);save()}}
function editPlan(k){let p=find(data.plans,k)||{name:'',amount:'',category:'',month:selectedMonth,recurring:false,dueDay:1};sheet(k?'Editar gasto planificado':'Nuevo gasto planificado',`<form onsubmit="savePlan(event,'${k||''}')"><label class="field">Nombre del gasto<input name="name" value="${esc(p.name)}" placeholder="Ej. Gimnasio" required></label><label class="field">Valor COP<input type="number" name="amount" min="1" step="1" value="${p.amount}" required></label><label class="field">Categoría<select name="category">${cats('expense',p.category)}</select></label><label class="field">Mes<input type="month" name="month" value="${p.month}" required></label><label class="field">Día de vencimiento (1–31)<input type="number" name="dueDay" min="1" max="31" value="${p.dueDay||1}" required></label><label class="field"><input type="checkbox" name="recurring" ${p.recurring?'checked':''}> Repetir en los siguientes meses (al abrir el plan)</label><button class="primary">Guardar planificación</button>${k?`<button type="button" class="outline" onclick="deletePlan('${k}')">Eliminar planificación</button>`:''}</form>`)}function savePlan(e,k){e.preventDefault();let f=new FormData(e.target),v={name:f.get('name').trim(),amount:+f.get('amount'),category:f.get('category'),month:f.get('month'),recurring:f.has('recurring'),dueDay:+f.get('dueDay')||1};if(k){let p=find(data.plans,k);if(p.generated||p.debtId){alert('Esta cuota se gestiona desde su origen.');return}if(p.paid){alert('Para modificar un pago realizado, primero desmárcalo.');return}Object.assign(p,v)}else data.plans.push({id:id(),...v,paid:false});closeModal();save()}function deletePlan(k){let p=find(data.plans,k);if(p.debtId){alert('Gestiona esta cuota desde Compras a cuotas.');return}if(p.paid){alert('Desmarca primero el pago para quitar su movimiento asociado.');return}if(confirm('¿Eliminar esta planificación?')){data.plans=data.plans.filter(x=>x.id!==k);closeModal();save()}}
function togglePlan(k,checked){let p=find(data.plans,k);if(!p)return;if(checked){sheet('Confirmar pago 💛',`<p>Vas a registrar <b>${esc(p.name)}</b> por <b>${money(p.amount)}</b> como gasto real.</p><form onsubmit="confirmPlan(event,'${k}')"><label class="field">¿Desde qué banco o cuenta pagaste?<select name="account" required>${accts()}</select></label><label class="field">Fecha del pago<input type="date" name="date" value="${today()}" required></label><button class="primary">✓ Confirmar pago</button><button type="button" class="outline" onclick="closeModal();render()">Cancelar</button></form>`)}else{if(p.transactionId){data.transactions=data.transactions.filter(t=>t.id!==p.transactionId)}p.paid=false;p.transactionId=null;save()}}function confirmPlan(e,k){e.preventDefault();let p=find(data.plans,k);if(p.paid)return;let f=new FormData(e.target),t={id:id(),planId:k,type:'expense',description:p.name,amount:p.amount,category:p.category,account:f.get('account'),date:f.get('date')};data.transactions.push(t);p.paid=true;p.transactionId=t.id;closeModal();save()}
function editCategory(k){let c=find(data.categories,k)||{name:'',icon:'✨',type:catType};sheet(k?'Editar categoría':'Agregar categoría',`<form onsubmit="saveCategory(event,'${k||''}')"><label class="field">Nombre<input name="name" value="${esc(c.name)}" required></label><label class="field">Ícono (emoji)<input name="icon" value="${esc(c.icon)}" maxlength="8" required></label><label class="field">Tipo<select name="type"><option value="expense" ${c.type==='expense'?'selected':''}>Gasto</option><option value="income" ${c.type==='income'?'selected':''}>Ingreso</option></select></label><button class="primary">Guardar categoría</button></form>`)}function saveCategory(e,k){e.preventDefault();let f=new FormData(e.target),v={name:f.get('name').trim(),icon:f.get('icon').trim(),type:f.get('type')};if(k)Object.assign(find(data.categories,k),v);else data.categories.push({id:id(),...v});closeModal();save()}function deleteCategory(k){if(data.transactions.some(t=>t.category===k)||data.plans.some(p=>p.category===k)){alert('Esta categoría tiene movimientos o pagos asociados. No se puede eliminar.');return}if(confirm('¿Eliminar categoría?')){data.categories=data.categories.filter(x=>x.id!==k);save()}}
function editAccount(k){let a=find(data.accounts,k)||{name:''};sheet(k?'Editar cuenta':'Nueva cuenta',`<form onsubmit="saveAccount(event,'${k||''}')"><label class="field">Nombre del banco o medio de pago<input name="name" value="${esc(a.name)}" required></label><button class="primary">Guardar</button></form>`)}function deleteAccount(k){const a=find(data.accounts,k);if(!a)return;const used=data.transactions.filter(t=>t.account===k).length+data.transfers.filter(t=>t.from===k||t.to===k).length;if(used){alert(`No puedes eliminar ${a.name} porque tiene ${used} movimiento(s) asociado(s). Para conservar tu historial, primero cambia esos movimientos a otra cuenta o elimina los registros correspondientes.`);return}if(!confirm(`¿Eliminar la cuenta "${a.name}"? Esta acción no se puede deshacer.`))return;data.accounts=data.accounts.filter(x=>x.id!==k);save()}
function saveAccount(e,k){e.preventDefault();let name=new FormData(e.target).get('name').trim();if(k)find(data.accounts,k).name=name;else data.accounts.push({id:id(),name});closeModal();save()}
function editGeneric(key,k){let x=find(data[key],k)||{name:'',amount:'',saved:0,date:today(),month:selectedMonth};sheet(k?'Editar':'Agregar',`<form onsubmit="saveGeneric(event,'${key}','${k||''}')"><label class="field">Nombre<input name="name" value="${esc(x.name)}" required></label>${key==='reminders'?`<label class="field">Fecha<input type="date" name="date" value="${x.date}" required></label>`:`<label class="field">${key==='goals'?'Meta COP':'Límite COP'}<input type="number" min="1" name="amount" value="${x.amount}" required></label>`}${key==='goals'?`<label class="field">Ahorrado COP<input type="number" min="0" name="saved" value="${x.saved||0}" required></label>`:''}<input type="hidden" name="month" value="${selectedMonth}"><button class="primary">Guardar</button>${k?`<button type="button" class="outline" onclick="deleteGeneric('${key}','${k}')">Eliminar</button>`:''}</form>`)}function saveGeneric(e,key,k){e.preventDefault();let f=new FormData(e.target),v={name:f.get('name'),month:f.get('month'),amount:+f.get('amount')||0,saved:+f.get('saved')||0,date:f.get('date')||''};if(k)Object.assign(find(data[key],k),v);else data[key].push({id:id(),...v});closeModal();save()}function deleteGeneric(key,k){if(confirm('¿Eliminar?')){data[key]=data[key].filter(x=>x.id!==k);closeModal();save()}}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='mi-finanzas-respaldo-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}async function importData(file){if(!file)return;try{let v=JSON.parse(await file.text());if(!['accounts','categories','transactions','plans','goals','budgets','reminders'].every(k=>Array.isArray(v[k])))throw Error('Formato incorrecto');if(confirm('¿Reemplazar todos los datos actuales por el respaldo?')){data=v;for(const k of ['transfers','debts'])if(!Array.isArray(data[k]))data[k]=[];save()}}catch(e){alert('No se pudo importar: '+e.message)}}
// Acceso preparado para Atajos: https://sitio/?action=gasto&amount=35000

function monthOffset(m,n){let [y,mm]=m.split('-').map(Number),d=new Date(y,mm-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function dueDate(p){let [y,m]=p.month.split('-').map(Number);let last=new Date(y,m,0).getDate();return p.month+'-'+String(Math.min(Math.max(1,p.dueDay||1),last)).padStart(2,'0')}
function ensureRecurring(m){let changed=false;for(const origin of data.plans.filter(p=>p.recurring&&!p.generated&&!p.debtId&&p.month<=m)) {let cursor=monthOffset(origin.month,1),count=0;while(cursor<=m&&count++<240){if(!data.plans.some(p=>p.originId===origin.id&&p.month===cursor)){data.plans.push({id:id(),name:origin.name,amount:origin.amount,category:origin.category,month:cursor,dueDay:origin.dueDay||1,recurring:false,generated:true,originId:origin.id,paid:false});changed=true}cursor=monthOffset(cursor,1)}}if(changed)localStorage.setItem('mf-v5',JSON.stringify(data))}
function transfersPage(){let rows=data.transfers.slice().sort((a,b)=>b.date.localeCompare(a.date));return `${header()}<h1>🔁 Transferencias</h1><p class="muted">Mueve dinero entre cuentas sin alterar tus ingresos ni gastos.</p><button class="primary" onclick="editTransfer()">+ Nueva transferencia</button><div class="card">${rows.map(t=>`<div class="listrow">${icon('🔁')}<div class="grow"><b>${esc(accountName(t.from))} → ${esc(accountName(t.to))}</b><div class="muted small">${fmtDate(t.date)} · ${esc(t.note||'Transferencia')}</div></div><b>${money(t.amount)}</b><button class="outline" onclick="deleteTransfer('${t.id}')">🗑</button></div>`).join('')||'<div class="empty">Todavía no hay transferencias.</div>'}</div>`}
function editTransfer(){sheet('Transferir entre cuentas',`<form onsubmit="saveTransfer(event)"><label class="field">Monto COP<input type="number" name="amount" min="1" step="1" required></label><label class="field">Desde<select name="from" required>${accts()}</select></label><label class="field">Hacia<select name="to" required>${accts()}</select></label><label class="field">Fecha<input type="date" name="date" value="${today()}" required></label><label class="field">Nota<input name="note" placeholder="Opcional"></label><button class="primary">Guardar transferencia</button></form>`)}
function saveTransfer(e){e.preventDefault();let f=new FormData(e.target);if(f.get('from')===f.get('to')){alert('Selecciona dos cuentas diferentes.');return}data.transfers.push({id:id(),amount:+f.get('amount'),from:f.get('from'),to:f.get('to'),date:f.get('date'),note:f.get('note').trim()});closeModal();save()}
function deleteTransfer(k){if(confirm('¿Eliminar esta transferencia?')){data.transfers=data.transfers.filter(t=>t.id!==k);save()}}
function debtsPage(){return `${header()}<h1>🧾 Compras a cuotas</h1><p class="muted">Programa las cuotas sin descontar toda la compra de una vez.</p><button class="primary" onclick="editDebt()">+ Registrar compra a cuotas</button><div class="card">${data.debts.map(d=>{let ps=data.plans.filter(p=>p.debtId===d.id),paid=ps.filter(p=>p.paid).length;return `<div class="listrow">${icon('🧾')}<div class="grow"><b>${esc(d.name)}</b><div class="muted small">${paid}/${ps.length} cuotas pagadas · Pendiente ${money(total(ps.filter(p=>!p.paid)))}</div><div class="bar"><div style="width:${ps.length?100*paid/ps.length:0}%"></div></div></div><button class="outline" onclick="viewDebt('${d.id}')">Ver</button></div>`}).join('')||'<div class="empty">No hay compras a cuotas registradas.</div>'}</div><p class="muted small">Las cuotas se incluyen en Plan de gastos del mes correspondiente. No se cobran automáticamente.</p>`}
function editDebt(){sheet('Nueva compra a cuotas',`<form onsubmit="saveDebt(event)"><label class="field">Compra<input name="name" placeholder="Ej. Celular" required></label><label class="field">Total COP<input type="number" name="amount" min="1" step="1" required></label><label class="field">Número de cuotas<input type="number" name="installments" min="1" max="120" value="6" required></label><label class="field">Primer mes<input type="month" name="month" value="${selectedMonth}" required></label><label class="field">Día de pago<input type="number" name="dueDay" min="1" max="31" value="15" required></label><label class="field">Categoría<select name="category">${cats('expense')}</select></label><button class="primary">Crear cuotas</button></form>`)}
function saveDebt(e){e.preventDefault();let f=new FormData(e.target),amount=+f.get('amount'),n=+f.get('installments'),base=Math.floor(amount/n),rest=amount-base*n;let d={id:id(),name:f.get('name').trim(),amount,installments:n,month:f.get('month'),dueDay:+f.get('dueDay'),category:f.get('category')};data.debts.push(d);for(let i=0;i<n;i++)data.plans.push({id:id(),name:d.name+' · cuota '+(i+1)+'/'+n,amount:base+(i===n-1?rest:0),category:d.category,month:monthOffset(d.month,i),dueDay:d.dueDay,paid:false,debtId:d.id});closeModal();page='deudas';save()}
function viewDebt(k){let d=find(data.debts,k);if(!d)return;let ps=data.plans.filter(p=>p.debtId===k);sheet('Cuotas de '+esc(d.name),`<p>Total: <b>${money(d.amount)}</b></p>${ps.map(p=>`<div class="listrow"><span>${p.paid?'✅':'⏳'}</span><div class="grow"><b>${esc(p.month)}</b><div class="muted small">${p.paid?'Pagada':'Pendiente'}</div></div><b>${money(p.amount)}</b>${!p.paid?`<button class="outline" onclick="closeModal();togglePlan('${p.id}',true)">Pagar</button>`:''}</div>`).join('')}<button class="outline" onclick="deleteDebt('${k}')">Eliminar compra y cuotas</button>`)}
function deleteDebt(k){let ps=data.plans.filter(p=>p.debtId===k);if(ps.some(p=>p.paid)){alert('Esta compra tiene cuotas pagadas. Para conservar tu historial, primero desmarca sus pagos desde el Plan.');return}if(confirm('¿Eliminar la compra y todas sus cuotas pendientes?')){data.plans=data.plans.filter(p=>p.debtId!==k);data.debts=data.debts.filter(d=>d.id!==k);closeModal();save()}}
let calendarMonth=selectedMonth;
function calendarPage(){let [y,m]=calendarMonth.split('-').map(Number),first=new Date(y,m-1,1).getDay(),days=new Date(y,m,0).getDate();ensureRecurring(calendarMonth);let ps=data.plans.filter(p=>p.month===calendarMonth),ts=data.transactions.filter(t=>t.date?.startsWith(calendarMonth));let cells=Array.from({length:first},()=>'<div></div>');for(let d=1;d<=days;d++){let date=calendarMonth+'-'+String(d).padStart(2,'0'),p=ps.filter(x=>dueDate(x)===date),t=ts.filter(x=>x.date===date);cells.push(`<button class="day" onclick="calendarDay('${date}')"><b>${d}</b><div class="dots">${p.some(x=>!x.paid)?'<i class="dot orange"></i>':''}${p.some(x=>x.paid)?'<i class="dot green"></i>':''}${t.some(x=>x.type==='income')?'<i class="dot purple"></i>':''}${t.some(x=>x.type==='expense')?'<i class="dot pinkdot"></i>':''}</div></button>`)}return `${header()}<h1>🗓️ Calendario financiero</h1><div class="row between"><button class="outline" onclick="calendarMonth=monthOffset(calendarMonth,-1);render()">‹</button><h2>${new Date(y,m-1,1).toLocaleDateString('es-CO',{month:'long',year:'numeric'})}</h2><button class="outline" onclick="calendarMonth=monthOffset(calendarMonth,1);render()">›</button></div><div class="calendar">${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map(x=>`<span class="weekday">${x}</span>`).join('')}${cells.join('')}</div><p class="muted small">🟠 Pendiente · 🟢 Pagado · 🟣 Ingreso · 🌸 Gasto</p><h2>Pagos del mes</h2><div class="card">${ps.slice().sort((a,b)=>a.dueDay-b.dueDay).map(p=>`<div class="listrow">${icon(p.paid?'✅':'⏳')}<div class="grow"><b>${esc(p.name)}</b><div class="muted small">${dueDate(p)} · ${p.paid?'Pagado':'Pendiente'}</div></div><b>${money(p.amount)}</b>${!p.paid?`<button class="outline" onclick="togglePlan('${p.id}',true)">Pagar</button>`:''}</div>`).join('')||'<div class="empty">No hay pagos planificados.</div>'}</div>`}
function calendarDay(date){let ps=data.plans.filter(p=>dueDate(p)===date),ts=data.transactions.filter(t=>t.date===date);sheet('📅 '+date,`${ps.map(p=>`<div class="listrow"><div class="grow">${p.paid?'✅':'⏳'} ${esc(p.name)}</div><b>${money(p.amount)}</b>${!p.paid?`<button class="outline" onclick="togglePlan('${p.id}',true)">Pagar</button>`:''}</div>`).join('')}${ts.map(t=>`<div class="listrow"><div class="grow">${esc(t.description)}</div><b>${t.type==='income'?'+':'−'} ${money(t.amount)}</b></div>`).join('')||(!ps.length?'<p>Sin movimientos ni pagos para este día.</p>':'')}`)}

render();let q=new URLSearchParams(location.search);if(q.get('action')==='gasto')movement('expense',q.get('amount')||'');if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
